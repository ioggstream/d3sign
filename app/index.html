<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Design &amp; D3FEND</title>
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>
<body>
  <!-- The workbench is this element, not <body>: libraries append their working
       elements to <body> (mermaid parks a temp <div> there for the whole of a
       render, CodeMirror its tooltip containers), and as grid items those stole a
       row from the layout and shrank every pane while they were up. See the
       #app-shell rule in styles/app.css. -->
  <div id="app-shell">
  <header>
    <!-- The mark is three connected nodes: the diagram is what the app is about,
         and it is the one place in the chrome that carries brand colour. -->
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16.5 12 7l5 9.5" />
          <circle cx="12" cy="6" r="2.4" fill="#fff" stroke="none" />
          <circle cx="6" cy="17.5" r="2.4" fill="#fff" stroke="none" />
          <circle cx="18" cy="17.5" r="2.4" fill="#fff" stroke="none" />
        </svg>
      </span>
      <h1>Design <span class="brand-amp">&amp;</span> D3FEND</h1>
    </div>
    <div class="header-tools">
      <select id="example-select" aria-label="Load an example diagram"
              title="Load an example diagram"></select>
      <button type="button" id="reset-layout-button" class="copy-button"
              title="Put every view back in the column it ships in">Reset layout</button>
      <!-- Session, not query: these act on everything this browser is holding
           for you (docs/adr/0021-sparql-query-pane.md). -->
      <button type="button" id="dump-session-button" class="copy-button"
              title="Download every saved query and document as one markdown file">Dump session</button>
      <button type="button" id="destroy-session-button" class="copy-button"
              title="Delete every saved query and document from this browser">Destroy session</button>
    </div>
    <div id="lint-message" class="lint-message" role="status" hidden></div>
  </header>
  <!-- Every column is a tab group and every pane can live in any of them, so the
       tab bars are empty here: layout/columns.js fills them from the saved
       layout (docs/adr/0022-column-tab-groups.md). The panes below start in the
       column they ship in, which is also where the default layout puts them, so
       the first render moves nothing that has not been rearranged. -->
  <main id="app-grid">
    <div id="col-left" class="col">
      <div class="tab-bar" role="tablist" aria-label="Left column views"></div>

      <section id="editor-pane" class="pane" role="tabpanel">
        <div class="pane-header">
          <h2>Mermaid + D3FEND source</h2>
          <button type="button" id="copy-editor-button" class="copy-button"
                  title="Copy the whole markdown source, mermaid blocks and all, to the clipboard">Copy</button>
        </div>
        <div id="editor-host"></div>
      </section>

      <!-- The browser-local document library. Next to the editor because it acts
           on what the editor is showing (docs/adr/0023-browser-local-file-store.md). -->
      <section id="files-pane" class="pane" role="tabpanel" hidden>
        <div class="pane-header">
          <h2>Files</h2>
          <span class="tab-key">Alt+F</span>
          <span id="files-dirty" class="dirty-badge" hidden>unsaved</span>
          <div class="files-tools">
            <button type="button" id="file-save-as-button" class="copy-button"
                    title="Store the current text under a name">Save as…</button>
            <button type="button" id="file-import-button" class="copy-button"
                    title="Read a markdown file from disk into the library">Import</button>
            <button type="button" id="file-export-button" class="copy-button"
                    title="Download the current text as a markdown file">Export</button>
            <input type="file" id="file-import-input" accept=".md,.markdown,text/markdown" hidden />
          </div>
        </div>
        <p class="files-hint">
          The document you are editing is saved in this browser as you type, and comes
          back on reload. Saved files below are named copies of it.
        </p>
        <div id="files-host" class="pane-body"></div>
      </section>
    </div>

    <div class="gutter gutter-col" id="gutter-main-col"></div>

    <div id="col-mid" class="col">
      <div class="tab-bar" role="tablist" aria-label="Middle column views"></div>
    </div>

    <div class="gutter gutter-col" id="gutter-mid-col"></div>

    <div id="col-right" class="col">
      <div class="tab-bar" role="tablist" aria-label="Right column views"></div>

      <!-- Starts here rather than in the middle column: the TriG pane is a
           secondary view, so the graph gets the width until Alt+, asks otherwise. -->
      <section id="turtle-pane" class="pane" role="tabpanel" hidden>
        <div class="pane-header">
          <h2>TriG (RDF)</h2>
          <span class="tab-key">Alt+,</span>
          <span id="turtle-dirty" class="dirty-badge" hidden>edited</span>
          <div class="turtle-tools">
            <button type="button" id="regenerate-turtle-button" class="copy-button" hidden
                    title="Discard the hand-edits and re-serialize from the mermaid source">Regenerate</button>
            <button type="button" id="copy-turtle-button" class="copy-button"
                    title="Copy the whole TriG document — every named graph — to the clipboard">Copy</button>
            <button type="button" id="turtle-hide-button" class="icon-button"
                    title="Move to its own column (Alt+,)">⇤</button>
          </div>
        </div>
        <div id="turtle-host"></div>
      </section>

      <section id="preview-pane" class="pane" role="tabpanel" hidden>
        <div id="preview-body" class="pane-body">
          <div id="diagram-list-host"></div>
          <div id="mermaid-host"></div>
        </div>
      </section>

      <section id="graph-pane" class="pane" role="tabpanel">
        <div class="pane-header">
          <h2>D3FEND Graph</h2>
          <div id="graph-filter-chips" class="filter-chips"></div>
          <div id="graph-selection" class="graph-selection is-empty">no selection</div>
          <div class="graph-tools">
            <select id="layout-select" title="Layout algorithm"></select>
            <button type="button" id="rotate-ccw" class="icon-button" title="Rotate 90° counter-clockwise">⟲</button>
            <button type="button" id="rotate-cw" class="icon-button" title="Rotate 90° clockwise">⟳</button>
          </div>
        </div>
        <div id="cy-host"></div>
        <dialog id="node-panel" class="node-panel"></dialog>
      </section>

      <!-- Rows rather than columns: the results table wants the full width, and
           this column is the widest one (docs/adr/0021-sparql-query-pane.md). -->
      <section id="query-pane" class="pane" role="tabpanel" hidden>
        <div class="pane-header">
          <h2>SPARQL</h2>
          <div id="query-filter-chips" class="filter-chips"></div>
          <select id="query-select" title="Load a query from the library"></select>
          <select id="saved-query-select" title="Reopen a query saved in this browser"></select>
          <div class="query-tools">
            <button type="button" id="save-query-button" class="copy-button"
                    title="Save this query in the browser (Ctrl+S)">Save <span class="tab-key">Ctrl+S</span></button>
            <button type="button" id="toggle-saved-button" class="icon-button" aria-expanded="false"
                    title="Show the queries saved in this browser">▤</button>
            <button type="button" id="run-query-button" class="copy-button btn--primary"
                    title="Run the query (Ctrl+Enter)">▶ Run <span class="tab-key">Ctrl+Enter</span></button>
            <button type="button" id="cancel-query-button" class="icon-button" hidden
                    title="Cancel by restarting the query engine — a running SPARQL query cannot be interrupted">⏹</button>
            <button type="button" id="copy-query-button" class="copy-button"
                    title="Copy the query text to the clipboard, without the prefix preamble">Copy</button>
          </div>
        </div>
        <!-- A plain block above the grid, not a third grid row: the pane's row
             gutter divides the editor from the results and must keep doing
             exactly that (docs/adr/0021-sparql-query-pane.md). -->
        <div id="saved-queries" class="saved-queries" hidden></div>
        <div id="query-grid">
          <div id="query-host"></div>
          <div class="gutter gutter-row" id="gutter-query-row"></div>
          <div id="query-results" class="query-results"></div>
        </div>
        <div id="query-status" class="query-status">no query run yet</div>
      </section>
    </div>
  </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
